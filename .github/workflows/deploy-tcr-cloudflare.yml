name: Deploy TCR to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-tcr-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcr-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID missing'; exit 2; }
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build current main
        run: npm run build
      - name: Deploy TCR to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy dist --project-name=taxcasereview-crm --branch=main --commit-dirty=true
      - name: Verify live TCR release marker
        shell: bash
        run: |
          marker='TCR_AI_INTELLIGENCE_RELEASE_20261002_1225_ET'
          for i in 1 2 3 4 5 6; do
            live=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://taxrescrm.app/tcr-ai-intelligence-release.txt?v=$(date +%s)" || true)
            if printf '%s' "$live" | grep -q "$marker"; then
              echo 'taxrescrm.app is serving the AI Intelligence release marker.'
              exit 0
            fi
            sleep 10
          done
          echo 'Cloudflare deployment ran but taxrescrm.app did not expose the release marker.'
          exit 1
