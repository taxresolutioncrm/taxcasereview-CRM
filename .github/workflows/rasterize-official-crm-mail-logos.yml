name: Rasterize official CRM logos for sandbox billing mail
on:
  push:
    branches:
      - fix/real-email-taxres-logo-cid-and-design-20261103
    paths:
      - .github/workflows/rasterize-official-crm-mail-logos.yml
      - public/bocasync-logo.svg
      - public/camvella-logo.svg
      - public/restore-relay-logo.svg
      - public/oculivo-logo.svg
      - public/groundivo-logo.svg
      - public/poolverge-official-mark.svg
      - public/romylabs-logo.svg
permissions:
  contents: write
jobs:
  official-logo-png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer for existing approved assets
        run: python -m pip install --disable-pip-version-check --quiet 'CairoSVG==2.7.1'
      - name: Convert official committed SVG assets to PNG, no design changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image
          files = [
            'bocasync-logo.svg',
            'camvella-logo.svg',
            'restore-relay-logo.svg',
            'oculivo-logo.svg',
            'groundivo-logo.svg',
            'poolverge-official-mark.svg',
          ]
          for filename in files:
              source=Path('public')/filename
              if not source.exists():
                  raise SystemExit(f'Official source missing: {source}')
              target=source.with_suffix('.png')
              cairosvg.svg2png(url=str(source),write_to=str(target),output_width=620)
              im=Image.open(target)
              im.verify()
              print(filename,'=>',target,'valid PNG',target.stat().st_size)
          PY
      - name: Commit only generated email PNG assets to sandbox branch
        run: |
          git config user.name "RomyLabs Sandbox Certification"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/bocasync-logo.png public/camvella-logo.png public/restore-relay-logo.png public/oculivo-logo.png public/groundivo-logo.png public/poolverge-official-mark.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(email): rasterize committed official CRM SVG logos to email-compatible PNG"
            git push origin HEAD:fix/real-email-taxres-logo-cid-and-design-20261103
          fi
