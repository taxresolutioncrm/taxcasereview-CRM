name: Sandbox Universal Firm Documents Gate

on:
  push:
    branches:
      - sandbox/universal-firm-documents-20260914

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full app build
        run: |
          npm run build
          git diff --exit-code -- . ':!package-lock.json'
      - name: Parse Edge Function
        run: npx --yes esbuild supabase/functions/office-agreement-file/index.ts --bundle --platform=neutral --format=esm --external:* --outfile=/tmp/office-agreement-file.js
      - name: Parse migration SQL
        run: |
          python -m pip install --quiet pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          parse_sql(Path('supabase/migrations/20260914184500_universal_firm_documents.sql').read_text())
          print('PASS migration parse')
          PY
      - name: Verify universal firm-doc invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "admin_romylabs_office_documents" src/components/admin/UniversalOfficeESign.jsx
          grep -q "Firm Documents" src/components/admin/UniversalOfficeESign.jsx
          grep -q "Signed agreements and completion certificates will appear here automatically" src/components/admin/UniversalOfficeESign.jsx
          grep -q "registerUniversalFirmDocuments" supabase/functions/office-agreement-file/index.ts
          grep -q "romylabs_office_documents" supabase/functions/office-agreement-file/index.ts
          grep -q "source_envelope_id,document_kind" supabase/functions/office-agreement-file/index.ts
          grep -q "create table if not exists public.romylabs_office_documents" supabase/migrations/20260914184500_universal_firm_documents.sql
