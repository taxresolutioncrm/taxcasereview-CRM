name: Bizee Embed Acceptance (temporary)

on:
  push:
    branches:
      - sandbox/formacorp-bizee-approved-embed-20260918

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test Bizee dashboard inside CRM iframe
        env:
          TEST_URL: https://sandbox-formacorp-bizee-appr.taxcasereview-crm.pages.dev/bizee-embed-test.html
        run: |
          cat > .tmp-bizee-embed-test.mjs <<'JS'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({headless:true})
          const page = await browser.newPage()
          const errors=[]
          page.on('console', m => { if (m.type()==='error') errors.push(m.text()) })
          page.on('pageerror', e => errors.push(String(e)))
          const resp = await page.goto(process.env.TEST_URL, {waitUntil:'networkidle', timeout:60000})
          await page.waitForTimeout(5000)
          const frames = page.frames().map(f => f.url())
          const bizeeFrame = frames.find(u => u.startsWith('https://orders.bizee.com/'))
          console.log('top_status='+resp?.status())
          console.log('frames='+JSON.stringify(frames))
          console.log('console_errors='+JSON.stringify(errors))
          await page.screenshot({path:'bizee-embed-test.png',fullPage:true})
          await browser.close()
          if (!bizeeFrame) {
            console.error('FAIL: orders.bizee.com did not load as a child frame')
            process.exit(1)
          }
          if (errors.some(e => /refused to display|frame-ancestors|x-frame-options/i.test(e))) {
            console.error('FAIL: browser reported frame blocking')
            process.exit(1)
          }
          console.log('PASS: Bizee dashboard host loaded inside iframe')
          JS
          node .tmp-bizee-embed-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bizee-embed-acceptance
          path: bizee-embed-test.png
