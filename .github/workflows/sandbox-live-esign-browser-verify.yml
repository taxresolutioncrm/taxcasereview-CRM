name: Live Universal E-Sign Browser Verification

on:
  push:
    branches:
      - sandbox/live-esign-browser-verify-20260914

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify real public signer in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          url='https://admin.romylabs.com/office-sign/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          for i in $(seq 1 24); do
            "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=12000 --dump-dom "$url?verify=$i" > /tmp/dom.html 2>/tmp/chrome.err || true
            if grep -q 'Universal E-Sign Live Verification' /tmp/dom.html && ! grep -q 'Signing request not found' /tmp/dom.html; then
              echo 'LIVE_BROWSER_SIGNER=PASS'
              grep -o 'Universal E-Sign Live Verification' /tmp/dom.html | head -1
              exit 0
            fi
            echo "attempt=$i signer_not_ready"
            grep -o 'Signing request not found\|Edge Function returned a non-2xx status code\|Universal E-Sign Live Verification' /tmp/dom.html | head -5 || true
            sleep 10
          done
          echo 'LIVE_BROWSER_SIGNER=FAIL'
          head -c 3000 /tmp/dom.html || true
          exit 1
