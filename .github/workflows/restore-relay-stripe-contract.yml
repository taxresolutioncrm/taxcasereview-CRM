name: Restore Relay agreement + Stripe email QA
on:
  pull_request:
    paths:
      - 'src/lib/restoreRelayAgreementPdf.js'
      - 'src/lib/restoreRelayPaymentProtocol.js'
      - 'src/components/admin/UniversalOfficeESign.jsx'
      - 'tests/restore-relay-contract-stripe-email.test.mjs'
      - 'supabase/migrations/20261118213000_restore_relay_office_esign_stripe_link.sql'
      - '.github/workflows/restore-relay-stripe-contract.yml'
permissions:
  contents: read
jobs:
  contract-and-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate 6-month PDF, one-email Stripe payment link and authorization
        run: node tests/restore-relay-contract-stripe-email.test.mjs
