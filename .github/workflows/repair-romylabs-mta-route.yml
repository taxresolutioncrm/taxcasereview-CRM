name: Repair RomyLabs MTA Route (romylabs.com outbound)

# Removes the stale  sender_domain == 'romylabs.com' → mx  branch from
# MtaOutboundStrategy so romylabs.com outbound falls through to the existing
# default relay — the same transport TaxRes and Restore Relay already use.
# OCI blocks port 25, so the mx branch causes all romylabs.com outbound to fail.
# No new routes or credentials are created.
#
# Prerequisites (set as GitHub Actions encrypted secrets before running):
#   STALWART_REPAIR_SECRET   — CF Workers secret; must match REPAIR_SERVICE_SECRET
#                              set via `wrangler secret put REPAIR_SERVICE_SECRET`
#
# Architecture:
#   GitHub Actions → CF Worker (stalwart-api.romylabs.com) → Stalwart JMAP management
#   The Worker authenticates with STALWART_API_TOKEN (CF encrypted secret) to call
#   x:MtaOutboundStrategy/set on mail.taxrescrm.net.
#
# AGENTS.md: GitHub Actions are manual QA / emergency fallback only.
# This is that emergency fallback — do not add push/schedule triggers.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: romylabs-mta-repair
  cancel-in-progress: false   # never cancel; two concurrent repairs would race

env:
  WORKER_URL: https://stalwart-api.romylabs.com

jobs:
  repair:
    name: Replace MTA route + verify outbound delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Verify Worker is reachable and healthy ────────────────────────────
      - name: Health-check CF Worker
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf --max-time 15 "$WORKER_URL/health")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || { echo 'Worker health check failed'; exit 1; }
          echo 'CF_WORKER_HEALTH_OK'

      # ── 2. Call the repair endpoint ──────────────────────────────────────────
      # No body needed — the Worker removes the bad romylabs.com → mx branch
      # and lets romylabs.com fall through to the existing default relay.
      - name: Invoke /api/mta-route-repair
        id: repair
        shell: bash
        env:
          STALWART_REPAIR_SECRET: ${{ secrets.STALWART_REPAIR_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf --max-time 60 \
            -X POST \
            -H "X-Repair-Secret: $STALWART_REPAIR_SECRET" \
            -H "Content-Type: application/json" \
            "$WORKER_URL/api/mta-route-repair")
          echo "$RESPONSE"

          # Save full audit to artifact
          echo "$RESPONSE" > /tmp/repair-audit.json

          # Verify the repair succeeded
          OK=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(str(d.get('ok','')).lower())")
          CLEAN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(str(d.get('audit',{}).get('verification',{}).get('confirmed_clean','')).lower())")

          echo "repair_ok=$OK"      >> "$GITHUB_OUTPUT"
          echo "confirmed_clean=$CLEAN" >> "$GITHUB_OUTPUT"

          if [ "$OK" != "true" ]; then
            echo "REPAIR FAILED — ok=$OK confirmed_clean=$CLEAN"
            exit 1
          fi
          echo 'MTA_ROUTE_REPAIR_SUCCEEDED'

      # ── 3. Upload audit JSON as workflow artifact ────────────────────────────
      - name: Upload repair audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-repair-audit
          path: /tmp/repair-audit.json
          retention-days: 90

      # ── 4. Summary ──────────────────────────────────────────────────────────
      - name: Repair complete
        if: steps.repair.outputs.repair_ok == 'true'
        shell: bash
        run: |
          echo "Repair confirmed: stale romylabs.com → mx branch removed."
          echo "romylabs.com outbound now falls through to the existing default relay."
          echo "Stalwart will retry queued messages on next retry cycle."
          echo "Next step: send a test email from info@romylabs.com and verify Gmail delivery + SPF/DKIM/DMARC."
