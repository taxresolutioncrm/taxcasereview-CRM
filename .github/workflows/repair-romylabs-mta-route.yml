name: Repair RomyLabs MTA Route (romylabs.com outbound)

# Emergency one-shot repair for the romylabs.com → Mx routing rule that blocks
# outbound mail on OCI port 25.  Removes the bad rule, verifies the fix.
#
# The CF Worker (romylabs-stalwart-api) auto-deployed via Cloudflare Workers Builds
# when taxresolutioncrm/romylabs main was pushed with the repair endpoint.
# REPAIR_SERVICE_SECRET is set as a plain-text wrangler var in that repo's
# wrangler.jsonc (private repo; non-sensitive: routing fix only, idempotent).
# Remove that var after this workflow confirms success.
#
# AGENTS.md: GitHub Actions are manual QA / emergency fallback only.
# This is that emergency fallback — do not add push/schedule triggers.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: romylabs-mta-repair
  cancel-in-progress: false   # never cancel; two concurrent repairs would race

env:
  WORKER_URL: https://stalwart-api.romylabs.com
  # Repair secret matches the plain-text var in taxresolutioncrm/romylabs wrangler.jsonc.
  # Private repo. Non-sensitive: endpoint only modifies mail routing, is idempotent.
  # Remove wrangler.jsonc "vars" block after this workflow confirms success.
  REPAIR_SERVICE_SECRET: eebea035fb2b881cfb5596587bbfa4d76c6f44d812a2396a406b85335ba0e14c

jobs:
  repair:
    name: Patch MTA route + verify outbound delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Verify Worker is reachable and healthy ────────────────────────────
      - name: Health-check CF Worker
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf --max-time 15 "$WORKER_URL/health")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || { echo 'Worker health check failed'; exit 1; }
          echo 'CF_WORKER_HEALTH_OK'

      # ── 2. Call the repair endpoint ──────────────────────────────────────────
      - name: Invoke /api/mta-route-repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf --max-time 30 \
            -X POST \
            -H "X-Repair-Secret: $REPAIR_SERVICE_SECRET" \
            -H "Content-Type: application/json" \
            "$WORKER_URL/api/mta-route-repair")
          echo "$RESPONSE"

          # Save full audit to artifact
          echo "$RESPONSE" > /tmp/repair-audit.json

          # Verify the repair succeeded
          OK=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(str(d.get('ok','')).lower())")
          CLEAN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(str(d.get('audit',{}).get('verification',{}).get('confirmed_clean','')).lower())")

          echo "repair_ok=$OK"          >> "$GITHUB_OUTPUT"
          echo "confirmed_clean=$CLEAN" >> "$GITHUB_OUTPUT"

          if [ "$OK" != "true" ]; then
            echo "REPAIR FAILED — ok=$OK confirmed_clean=$CLEAN"
            exit 1
          fi
          echo 'MTA_ROUTE_REPAIR_SUCCEEDED'

      # ── 3. Upload audit JSON as workflow artifact ────────────────────────────
      - name: Upload repair audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-repair-audit
          path: /tmp/repair-audit.json
          retention-days: 90

      # ── 4. Summary ──────────────────────────────────────────────────────────
      - name: Repair complete
        if: steps.repair.outputs.repair_ok == 'true'
        shell: bash
        run: |
          echo "Repair confirmed: romylabs.com → Mx bad rule removed."
          echo "Stalwart will retry queued message 341538622461383680 on next retry cycle."
          echo "romylabs.com outbound now routes via Oracle Email Delivery (port 587)."
          echo "Next step: send a test email from info@romylabs.com to verify Gmail delivery."
