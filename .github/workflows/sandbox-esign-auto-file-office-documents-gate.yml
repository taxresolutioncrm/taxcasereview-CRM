name: Sandbox E-Sign Auto-File Office Documents Gate

on:
  push:
    branches:
      - sandbox/esign-auto-file-office-documents-20260914

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full app build
        run: |
          npm run build
          git diff --exit-code -- . ':!package-lock.json'
      - name: Parse Edge Function
        run: |
          npx --yes esbuild supabase/functions/office-agreement-file/index.ts --bundle --platform=neutral --format=esm --external:* --outfile=/tmp/office-agreement-file.js
      - name: Verify auto-file invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "archiveCompletedOfficeDocuments" supabase/functions/office-agreement-file/index.ts
          grep -q "office_documents_archived" supabase/functions/office-agreement-file/index.ts
          grep -q "archive_completed_esign_internal" supabase/functions/office-agreement-file/index.ts
          grep -q "verify_internal_cron_token" supabase/functions/office-agreement-file/index.ts
          grep -q "office-agreements" supabase/functions/office-agreement-file/index.ts
          grep -q "/esign/\${doc.id}/signed-" supabase/functions/office-agreement-file/index.ts
          grep -q "/esign/\${doc.id}/certificate-of-completion.pdf" supabase/functions/office-agreement-file/index.ts
          grep -q "uploaded_by:'universal-esign'" supabase/functions/office-agreement-file/index.ts
          grep -q "tenant_not_found" supabase/functions/office-agreement-file/index.ts
