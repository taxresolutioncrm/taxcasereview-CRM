name: Sandbox E-Sign Resend Delivery Gate

on:
  push:
    branches:
      - sandbox/esign-resend-delivery-state-20260914

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esign_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d esign_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Parse migration SQL
        run: |
          python -m pip install --quiet pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          parse_sql(Path('supabase/migrations/20260914094500_esign_resend_delivery_state.sql').read_text())
          print('PASS: resend migration parses')
          PY

      - name: Bootstrap e-sign sandbox database
        shell: bash
        run: |
          psql -h 127.0.0.1 -U postgres -d esign_test -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create role anon;
          create role authenticated;
          create schema auth;
          create schema extensions;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select '{"email":"romy@romylabs.com"}'::jsonb $$;
          create or replace function public._is_platform_admin() returns boolean language sql stable as $$ select true $$;

          create table public.romylabs_office_signing_documents(
            id uuid primary key default gen_random_uuid(),
            firm_name text not null default 'Test Firm',
            title text not null default 'Test Agreement',
            signer_name text,
            signer_email text not null,
            token_hash text not null unique,
            status text not null,
            sent_at timestamptz,
            expires_at timestamptz,
            audit jsonb not null default '[]'::jsonb,
            updated_at timestamptz not null default now()
          );

          create table public.romylabs_esign_recipients(
            id uuid primary key default gen_random_uuid(),
            envelope_id uuid not null references public.romylabs_office_signing_documents(id) on delete cascade,
            recipient_order int not null default 1,
            role text not null default 'signer',
            name text,
            email text not null,
            status text not null,
            token_hash text,
            sent_at timestamptz,
            opened_at timestamptz,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table public.romylabs_esign_token_aliases(
            token_hash text primary key,
            envelope_id uuid not null references public.romylabs_office_signing_documents(id) on delete cascade,
            recipient_id uuid references public.romylabs_esign_recipients(id) on delete set null,
            source text not null,
            created_at timestamptz not null default now(),
            revoked_at timestamptz
          );

          create table public.romylabs_esign_events(
            id uuid primary key default gen_random_uuid(),
            envelope_id uuid not null references public.romylabs_office_signing_documents(id) on delete cascade,
            recipient_id uuid references public.romylabs_esign_recipients(id) on delete set null,
            event_type text not null,
            actor_email text,
            actor_name text,
            metadata jsonb not null default '{}'::jsonb,
            occurred_at timestamptz not null default now()
          );

          create or replace function public.admin_romylabs_mark_office_signing_sent(p_document_id uuid,p_event text default 'sent')
          returns jsonb language plpgsql security definer as $$
          begin
            update public.romylabs_office_signing_documents set status='sent',sent_at=now(),updated_at=now()
            where id=p_document_id and status in ('pending','sent','viewed');
            if not found then return jsonb_build_object('ok',false); end if;
            update public.romylabs_esign_recipients set status='sent',sent_at=now(),updated_at=now()
            where envelope_id=p_document_id and role='signer' and status in ('pending','sent','viewed');
            return jsonb_build_object('ok',true);
          end $$;
          SQL

      - name: Apply resend migration
        run: psql -h 127.0.0.1 -U postgres -d esign_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260914094500_esign_resend_delivery_state.sql

      - name: Verify resend delivery state behavior
        shell: bash
        run: |
          psql -h 127.0.0.1 -U postgres -d esign_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            d uuid; r uuid;
            old_hash text:=encode(digest('old-live-link','sha256'),'hex');
            new_hash text;
            res jsonb;
          begin
            insert into public.romylabs_office_signing_documents(signer_name,signer_email,token_hash,status,sent_at,audit)
            values('Signer','signer@example.test',old_hash,'viewed',now(),'[]'::jsonb)
            returning id into d;

            insert into public.romylabs_esign_recipients(envelope_id,name,email,status,token_hash,sent_at,opened_at)
            values(d,'Signer','signer@example.test','viewed',old_hash,now(),now())
            returning id into r;

            res:=public.admin_romylabs_refresh_office_signing_link(d,14);
            if coalesce((res->>'ok')::boolean,false) is not true then raise exception 'refresh failed %',res; end if;

            if (select status from public.romylabs_office_signing_documents where id=d) <> 'pending' then raise exception 'envelope falsely marked sent'; end if;
            if (select sent_at from public.romylabs_office_signing_documents where id=d) is not null then raise exception 'sent_at set before delivery'; end if;
            if (select status from public.romylabs_esign_recipients where id=r) <> 'pending' then raise exception 'recipient not pending'; end if;
            if (select sent_at from public.romylabs_esign_recipients where id=r) is not null then raise exception 'recipient sent_at set before delivery'; end if;

            select token_hash into new_hash from public.romylabs_office_signing_documents where id=d;
            if new_hash=old_hash then raise exception 'token did not rotate'; end if;
            if new_hash <> (select token_hash from public.romylabs_esign_recipients where id=r) then raise exception 'recipient token mismatch'; end if;

            if not exists(
              select 1 from public.romylabs_esign_token_aliases
              where envelope_id=d and token_hash=old_hash and revoked_at is null
            ) then raise exception 'old legitimate link not preserved'; end if;

            if not exists(select 1 from public.romylabs_esign_events where envelope_id=d and event_type='resend_prepared') then
              raise exception 'resend_prepared event missing';
            end if;

            res:=public.admin_romylabs_mark_office_signing_sent(d,'resent');
            if coalesce((res->>'ok')::boolean,false) is not true then raise exception 'delivery confirmation failed'; end if;
            if (select status from public.romylabs_office_signing_documents where id=d) <> 'sent' then raise exception 'envelope not sent after confirmation'; end if;
            if (select sent_at from public.romylabs_office_signing_documents where id=d) is null then raise exception 'sent_at missing after confirmation'; end if;
            if (select status from public.romylabs_esign_recipients where id=r) <> 'sent' then raise exception 'recipient not sent after confirmation'; end if;

            update public.romylabs_office_signing_documents set status='declined' where id=d;
            res:=public.admin_romylabs_refresh_office_signing_link(d,14);
            if coalesce((res->>'ok')::boolean,true) is not false then raise exception 'declined envelope allowed resend'; end if;
          end $$;

          select 'PASS: resend delivery state' as result;
          SQL
