name: Trace Live Universal Signer

on:
  push:
    branches:
      - sandbox/live-signer-production-trace-20260914

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trace all live admin JS assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://admin.romylabs.com'
          ts=$(date +%s)
          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$base/?trace=$ts" -o /tmp/live.html
          echo '=== SCRIPT SOURCES ==='
          grep -oE 'src="[^"]+\.js[^"]*"' /tmp/live.html | sed -E 's/^src="//;s/"$//' | tee /tmp/scripts.txt
          found=0
          while IFS= read -r js; do
            [ -n "$js" ] || continue
            [[ "$js" == http* ]] || js="$base$js"
            name=$(basename "${js%%\?*}")
            echo "=== FETCH $name ==="
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$js&trace=$ts" -o "/tmp/$name" || curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$js?trace=$ts" -o "/tmp/$name"
            count=$(grep -o 'mpxgxfqdbquzkrvvejkh' "/tmp/$name" | wc -l || true)
            echo "canonical_ref_count=$count"
            if [ "$count" -gt 0 ]; then
              found=1
              echo "CANONICAL_PROJECT_FOUND_IN=$name"
            fi
            grep -oE '[a-z]{20}\.supabase\.co' "/tmp/$name" | sort -u || true
          done < /tmp/scripts.txt
          if [ "$found" -ne 1 ]; then
            echo 'LIVE_APP_BUNDLE_CANONICAL_REF=NO'
            exit 1
          fi
          echo 'LIVE_APP_BUNDLE_CANONICAL_REF=YES'
