name: Trace Live Universal Signer

on:
  push:
    branches:
      - sandbox/live-signer-production-trace-20260914

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build current source and identify signer chunk
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx vite build
          signer=$(grep -rl 'mpxgxfqdbquzkrvvejkh' dist/assets | head -1 || true)
          echo "LOCAL_SIGNER_CHUNK=$signer"
          test -n "$signer"
          grep -q 'office-agreement-file' "$signer"
          cp "$signer" /tmp/local-signer.js
          name=$(basename "$signer")
          echo "SIGNER_NAME=$name" >> "$GITHUB_ENV"
      - name: Compare live signer chunk
        shell: bash
        run: |
          set -euo pipefail
          url="https://admin.romylabs.com/assets/$SIGNER_NAME"
          code=$(curl -sS -o /tmp/live-signer.js -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "$url?trace=$(date +%s)" || true)
          echo "LIVE_SIGNER_HTTP=$code"
          if [ "$code" != "200" ]; then
            echo 'LIVE_SIGNER_CHUNK_MISSING'
            exit 1
          fi
          echo "LIVE_CANONICAL_COUNT=$(grep -o 'mpxgxfqdbquzkrvvejkh' /tmp/live-signer.js | wc -l || true)"
          echo "LOCAL_SHA=$(sha256sum /tmp/local-signer.js | awk '{print $1}')"
          echo "LIVE_SHA=$(sha256sum /tmp/live-signer.js | awk '{print $1}')"
          cmp -s /tmp/local-signer.js /tmp/live-signer.js
          echo 'LIVE_SIGNER_CHUNK_MATCH=YES'
