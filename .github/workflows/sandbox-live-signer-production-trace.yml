name: Trace Live Universal Signer

on:
  push:
    branches:
      - sandbox/live-signer-production-trace-20260914

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trace live root bundle
        shell: bash
        run: |
          set -euo pipefail
          base='https://admin.romylabs.com'
          ts=$(date +%s)
          html=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$base/?trace=$ts")
          printf '%s' "$html" > /tmp/live.html
          js=$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js[^"]*"' | head -1 | sed -E 's/^src="//;s/"$//')
          echo "LIVE_MAIN_JS=$js"
          [[ "$js" == http* ]] || js="$base$js"
          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$js?trace=$ts" -o /tmp/live.js
          echo "CANONICAL_REF_COUNT=$(grep -o 'mpxgxfqdbquzkrvvejkh' /tmp/live.js | wc -l)"
          echo "OTHER_SUPABASE_REFS:"
          grep -oE '[a-z]{20}\.supabase\.co' /tmp/live.js | sort -u || true
          if ! grep -q 'mpxgxfqdbquzkrvvejkh' /tmp/live.js; then
            echo 'LIVE_BUNDLE_CANONICAL_REF=NO'
            exit 1
          fi
          echo 'LIVE_BUNDLE_CANONICAL_REF=YES'
