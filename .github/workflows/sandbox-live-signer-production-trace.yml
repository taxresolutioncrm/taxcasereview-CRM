name: Trace Live Universal Signer

on:
  push:
    branches:
      - sandbox/live-signer-production-trace-20260914

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build current source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx vite build
          signer=$(find dist/assets -maxdepth 1 -type f -name 'OfficeDocumentSign-*.js' | head -1)
          echo "LOCAL_SIGNER=$(basename "$signer")"
          echo "LOCAL_SIGNER_NAME=$(basename "$signer")" >> "$GITHUB_ENV"
          main=$(grep -oE 'src="/assets/index-[^"]+\.js"' dist/index.html | head -1 | sed -E 's#src="/assets/##;s/"$//')
          echo "LOCAL_MAIN=$main"
          echo "LOCAL_MAIN_NAME=$main" >> "$GITHUB_ENV"
          grep -oE 'OfficeDocumentSign-[A-Za-z0-9_-]+\.js' "dist/assets/$main" | sort -u || true
      - name: Inspect live main import mapping
        shell: bash
        run: |
          set -euo pipefail
          base='https://admin.romylabs.com'
          ts=$(date +%s)
          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$base/?trace=$ts" -o /tmp/live.html
          live_main=$(grep -oE 'src="/assets/index-[^"]+\.js"' /tmp/live.html | head -1 | sed -E 's#src="/assets/##;s/"$//')
          echo "LIVE_MAIN=$live_main"
          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$base/assets/$live_main?trace=$ts" -o /tmp/live-main.js
          echo 'LIVE_SIGNER_IMPORTS:'
          grep -oE 'OfficeDocumentSign-[A-Za-z0-9_-]+\.js' /tmp/live-main.js | sort -u || true
          if ! grep -q "$LOCAL_SIGNER_NAME" /tmp/live-main.js; then
            echo "LIVE_MAIN_POINTS_TO_CURRENT_SIGNER=NO"
            exit 1
          fi
          echo "LIVE_MAIN_POINTS_TO_CURRENT_SIGNER=YES"
