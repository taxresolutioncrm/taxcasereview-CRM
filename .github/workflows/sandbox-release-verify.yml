name: Sandbox Release Verify

on:
  push:
    branches:
      - sandbox/demo-paid-booking-tenant-scope-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full application build and invariant checks
        run: npm run build
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check changed Edge Functions
        run: |
          deno check --no-lock supabase/functions/demo-send-email/index.ts
          deno check --no-lock supabase/functions/booking-checkout/index.ts
          deno check --no-lock supabase/functions/stripe-checkout-webhook/index.ts
