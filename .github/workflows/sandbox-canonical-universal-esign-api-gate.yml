name: Sandbox Canonical Universal E-Sign API Gate

on:
  push:
    branches:
      - sandbox/canonical-universal-esign-api-20260914

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full app build
        run: |
          npm run build
          git diff --exit-code -- . ':!package-lock.json'
      - name: Verify canonical universal e-sign project
        run: |
          grep -q "UNIVERSAL_ESIGN_URL='https://mpxgxfqdbquzkrvvejkh.supabase.co'" src/pages/OfficeDocumentSign.jsx
          ! grep -q "SUPABASE_URL}/functions/v1/office-agreement-file" src/pages/OfficeDocumentSign.jsx
          grep -q "'apikey':UNIVERSAL_ESIGN_ANON_KEY" src/pages/OfficeDocumentSign.jsx
          ! grep -q "supabase.functions.invoke('office-agreement-file'" src/pages/OfficeDocumentSign.jsx
      - name: Execute public route redirect regression
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm')
          const src=fs.readFileSync('public/romylabs-admin-hotfix.js','utf8')
          function run(path){
            const redirects=[]
            const storage=()=>({length:0,key:()=>null,getItem:()=>null,setItem:()=>{},removeItem:()=>{}})
            const window={location:{hostname:'admin.romylabs.com',pathname:path,search:'',href:'https://admin.romylabs.com'+path,replace:(u)=>redirects.push(u)},addEventListener:()=>{},setInterval:()=>1,clearInterval:()=>{},history:{replaceState:()=>{}}}
            const document={body:{},readyState:'loading',addEventListener:()=>{},querySelectorAll:()=>[]}
            vm.runInNewContext(src,{window,document,localStorage:storage(),sessionStorage:storage(),URLSearchParams,URL,console,atob:(v)=>Buffer.from(v,'base64').toString('binary'),setInterval:()=>1,clearInterval:()=>{}})
            return redirects
          }
          if(run('/office-sign/testtoken').some(x=>String(x).startsWith('/crm-admin'))) throw new Error('office-sign redirected to admin')
          NODE
