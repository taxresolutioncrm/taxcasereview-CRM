name: AI Client Search Relevance Sandbox Build
on:
  push:
    branches:
      - sandbox/ai-client-search-relevance-20261009
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check-document-intelligence
      - run: npm run build
