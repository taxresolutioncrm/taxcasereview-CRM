name: Verify exact PoolVerge product card on RomyLabs production
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-poolverge-card-live.mjs'
      - '.github/workflows/verify-poolverge-card-live.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/verify-poolverge-card-live.mjs
      - run: node scripts/verify-poolverge-card-live.mjs
