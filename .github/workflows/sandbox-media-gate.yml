name: Sandbox TaxRes media build gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/webrtcRoom.js'
      - 'src/context/ScreenShareContext.jsx'
      - 'src/pages/Training.jsx'
      - 'src/pages/ScreenShareHost.jsx'
      - 'src/pages/ScreenShareJoin.jsx'
      - 'src/pages/MeetingRoom.jsx'
      - 'src/App.jsx'
      - 'src/pages/Dashboard.jsx'
      - 'src/pages/Settings.jsx'
      - 'src/pages/Email.jsx'
      - 'src/pages/Esign.jsx'
      - 'scripts/check-nashville-closeout.cjs'
      - 'scripts/check-nashville-central-quarantine.mjs'
      - 'supabase/migrations/20261013004500_quarantine_legacy_nashville_central_runtime.sql'
      - 'supabase/functions/m365-sync/index.ts'
      - 'supabase/functions/quickbooks-oauth-start/index.ts'
      - 'supabase/functions/quickbooks-oauth-callback/index.ts'
      - 'supabase/functions/formacorp-state-fee-intent/index.ts'
      - 'supabase/functions/formacorp-state-fee-confirm/index.ts'
      - '.github/workflows/sandbox-media-gate.yml'
permissions:
  contents: read
jobs:
  sandbox-build:
    if: ${{ startsWith(github.head_ref, 'sandbox/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
