name: Sandbox E-Sign Embedded Completion Stamp Gate

on:
  push:
    branches:
      - sandbox/esign-single-completed-package-20260914

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full app build
        run: |
          npm run build
          git diff --exit-code -- . ':!package-lock.json'

      - name: Parse e-sign Edge Function
        run: |
          npx --yes esbuild supabase/functions/office-agreement-file/index.ts --bundle --platform=neutral --format=esm --external:* --outfile=/tmp/office-agreement-file.js

      - name: Build stamp helper test module from production source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('supabase/functions/office-agreement-file/index.ts').read_text()
          start=s.index('function isPoaDocument')
          end=s.index('async function registerUniversalFirmDocuments',start)
          snippet=s[start:end]
          Path('/tmp/stamp-helper.ts').write_text(
              "import { PDFDocument, StandardFonts, rgb } from 'pdf-lib'\n"
              + snippet
              + "\nexport { isPoaDocument, stampCompletionOnDocument }\n"
          )
          PY
          npx --yes esbuild /tmp/stamp-helper.ts --bundle --platform=node --format=cjs --outfile=/tmp/stamp-helper.cjs

      - name: Verify embedded stamp and all-POA exclusion
        shell: bash
        run: |
          node <<'NODE'
          const {PDFDocument}=require('pdf-lib')
          const {isPoaDocument,stampCompletionOnDocument}=require('/tmp/stamp-helper.cjs')

          ;(async()=>{
            const src=await PDFDocument.create()
            src.addPage([612,792])
            src.addPage([612,792])
            const original=Buffer.from(await src.save())

            const base={
              id:'11111111-2222-4333-8444-555555555555',
              title:'Tax Service Agreement',
              source_filename:'service-agreement.pdf',
              signer_name:'Test Signer'
            }
            const stamped=Buffer.from(await stampCompletionOnDocument(
              new Uint8Array(original),base,'Test Signer','2026-09-14T17:52:41Z','a','b','c'
            ))
            const stampedPdf=await PDFDocument.load(stamped)
            if(stampedPdf.getPageCount()!==2) throw new Error('normal contract gained a page')
            if(Buffer.compare(original,stamped)===0) throw new Error('normal contract was not stamped')

            const poaCases=[
              {...base,title:'Form 2848 — Power of Attorney',source_filename:'2848.pdf'},
              {...base,title:'Florida State POA',source_filename:'DR-835.pdf'},
              {...base,title:'State Power of Attorney',source_filename:'state-authorization.pdf'},
              {...base,title:'Client POA',source_filename:'poa.pdf'},
            ]
            for(const doc of poaCases){
              if(!isPoaDocument(doc)) throw new Error('POA was not classified: '+JSON.stringify(doc))
              const out=Buffer.from(await stampCompletionOnDocument(
                new Uint8Array(original),doc,'Test Signer','2026-09-14T17:52:41Z','a','b','c'
              ))
              if(Buffer.compare(original,out)!==0) throw new Error('POA was modified: '+JSON.stringify(doc))
            }
            console.log('PASS: contract stamped in-place; IRS/state/generic POAs unchanged')
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE

      - name: Verify one visible signed document UX
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q ">Certificate</button>" src/components/admin/UniversalOfficeESign.jsx
          ! grep -q ">Completion Certificate</button>" src/components/admin/EnvelopeDetails.jsx
          grep -q "Completed signed documents will appear here automatically" src/components/admin/UniversalOfficeESign.jsx
          grep -q "document_kind:'signed_agreement'" supabase/functions/office-agreement-file/index.ts
          grep -q "eq('document_kind','completion_certificate')" supabase/functions/office-agreement-file/index.ts
          grep -q "ownerCopy=await sendSignedCopy(admin,doc,officeFacingSignedBytes)" supabase/functions/office-agreement-file/index.ts
          grep -q "signerCopy=await sendSignedCopy(admin,doc,officeFacingSignedBytes" supabase/functions/office-agreement-file/index.ts
          grep -q "completed-signed-" supabase/functions/office-agreement-file/index.ts
