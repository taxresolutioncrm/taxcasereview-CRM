name: Sandbox Portfolio E-Sign Office Sync R2 Gate

on:
  push:
    branches:
      - sandbox/portfolio-esign-office-sync-r2-20260913

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full app build
        run: |
          npm run build
          git diff --exit-code -- . ':!package-lock.json'
      - name: Parse office sync edge function
        run: |
          npx --yes esbuild supabase/functions/sync-product-offices/index.ts --bundle --platform=neutral --format=esm --external:* --outfile=/tmp/sync-product-offices.js
