name: TDS GitHub Secret Preflight

on:
  push:
    branches:
      - sandbox/validate-claude-tds-release-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check IRS TDS repository secret presence
        shell: bash
        env:
          IRS_TDS_CLIENT_ID: ${{ secrets.IRS_TDS_CLIENT_ID }}
          IRS_TDS_JWT_KID: ${{ secrets.IRS_TDS_JWT_KID }}
          IRS_TDS_JWT_PRIVATE_KEY_PEM: ${{ secrets.IRS_TDS_JWT_PRIVATE_KEY_PEM }}
          IRS_TDS_REDIRECT_URI: ${{ secrets.IRS_TDS_REDIRECT_URI }}
          IRS_TDS_REQUEST_URL: ${{ secrets.IRS_TDS_REQUEST_URL }}
          IRS_TDS_REQUEST_TEMPLATE: ${{ secrets.IRS_TDS_REQUEST_TEMPLATE }}
          IRS_TDS_STATUS_URL_TEMPLATE: ${{ secrets.IRS_TDS_STATUS_URL_TEMPLATE }}
          IRS_TDS_AUTH_FLOW_VERIFIED: ${{ secrets.IRS_TDS_AUTH_FLOW_VERIFIED }}
        run: |
          set -euo pipefail
          missing=0
          for NAME in             IRS_TDS_CLIENT_ID             IRS_TDS_JWT_KID             IRS_TDS_JWT_PRIVATE_KEY_PEM             IRS_TDS_REDIRECT_URI             IRS_TDS_REQUEST_URL             IRS_TDS_REQUEST_TEMPLATE             IRS_TDS_STATUS_URL_TEMPLATE             IRS_TDS_AUTH_FLOW_VERIFIED
          do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::GitHub repository secret is missing: $NAME"
              missing=1
            else
              echo "present: $NAME"
            fi
          done
          test "$missing" -eq 0
