name: TCR Tenant Audit - ROMYLABS
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Discover all tenants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/q.json
          import json
          q=r'''
          select jsonb_build_object(
            'tenant_columns',(select jsonb_agg(column_name order by ordinal_position) from information_schema.columns where table_schema='public' and table_name='tenants'),
            'tenant_sample',(select coalesce(jsonb_agg(to_jsonb(t)),'[]'::jsonb) from (select * from public.tenants limit 50) t)
          ) as audit;
          '''
          print(json.dumps({'query':q}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/q.json | tee /tmp/audit_result.json

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcr-romylabs-tenant-audit
          path: /tmp/audit_result*.json
