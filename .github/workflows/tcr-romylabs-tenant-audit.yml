name: TCR Tenant Audit - ROMYLABS
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - uses: actions/checkout@v4

      - name: Tenant and table inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/q1.json
          import json
          q=r'''
          select jsonb_build_object(
            'tenant_columns',(select jsonb_agg(column_name order by ordinal_position) from information_schema.columns where table_schema='public' and table_name='tenants'),
            'tenant_sample',(select coalesce(jsonb_agg(to_jsonb(t)),'[]'::jsonb) from (select * from public.tenants limit 50) t),
            'public_tables',(select coalesce(jsonb_agg(table_name order by table_name),'[]'::jsonb) from information_schema.tables where table_schema='public' and table_type='BASE TABLE')
          ) as audit;
          '''
          print(json.dumps({'query':q}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/q1.json | tee /tmp/r1.json

      - name: LinkedIn settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/q2.json
          import json
          q=r'''select coalesce(jsonb_agg(to_jsonb(s)),'[]'::jsonb) as linkedin_settings from (select tenant_id::text,product_id,autopilot,timezone,updated_at::text from linkedin_settings) s;'''
          print(json.dumps({'query':q}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/q2.json | tee /tmp/r2.json || echo '{"error":"linkedin_settings query failed"}' > /tmp/r2.json

      - name: LinkedIn posts state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/q3.json
          import json
          q=r'''select jsonb_build_object('posts_by_status',(select coalesce(jsonb_agg(jsonb_build_object('status',status,'cnt',cnt)),'[]'::jsonb) from (select status,count(*) as cnt from linkedin_posts group by status) s),'stale_publishing',(select count(*) from linkedin_posts where status='publishing' and updated_at < now() - interval '1 hour'),'next_scheduled',(select min(scheduled_for)::text from linkedin_posts where status='approved' and scheduled_for > now())) as audit;'''
          print(json.dumps({'query':q}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/q3.json | tee /tmp/r3.json || echo '{"error":"linkedin_posts query failed"}' > /tmp/r3.json

      - name: Cross-tenant isolation check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/q4.json
          import json
          q=r'''
          select jsonb_build_object(
            'employees_by_tenant',(select coalesce(jsonb_agg(jsonb_build_object('tenant_id',tenant_id::text,'cnt',cnt)),'[]'::jsonb) from (select tenant_id,count(*) as cnt from employees group by tenant_id) s),
            'leads_by_tenant',(select coalesce(jsonb_agg(jsonb_build_object('tenant_id',tenant_id::text,'cnt',cnt,'latest',latest::text)),'[]'::jsonb) from (select tenant_id,count(*) as cnt,max(created_at) as latest from leads group by tenant_id) s),
            'clients_by_tenant',(select coalesce(jsonb_agg(jsonb_build_object('tenant_id',tenant_id::text,'cnt',cnt)),'[]'::jsonb) from (select tenant_id,count(*) as cnt from clients group by tenant_id) s),
            'cases_by_tenant',(select coalesce(jsonb_agg(jsonb_build_object('tenant_id',tenant_id::text,'cnt',cnt)),'[]'::jsonb) from (select tenant_id,count(*) as cnt from cases group by tenant_id) s),
            'leads_null_tenant',(select count(*) from leads where tenant_id is null),
            'clients_null_tenant',(select count(*) from clients where tenant_id is null),
            'cases_null_tenant',(select count(*) from cases where tenant_id is null),
            'total_leads',(select count(*) from leads),
            'total_clients',(select count(*) from clients),
            'total_cases',(select count(*) from cases)
          ) as audit;
          '''
          print(json.dumps({'query':q}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/q4.json | tee /tmp/r4.json

      - name: Commit audit results to repo
        shell: bash
        run: |
          mkdir -p .audit-output
          cp /tmp/r1.json .audit-output/tenants.json
          cp /tmp/r2.json .audit-output/linkedin-settings.json
          cp /tmp/r3.json .audit-output/linkedin-posts.json
          cp /tmp/r4.json .audit-output/cross-tenant.json
          git config user.email "audit-bot@romylabs.com"
          git config user.name "ROMYLABS Audit Bot"
          git add .audit-output/
          git commit -m "audit: live tenant data $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes"
          git push
