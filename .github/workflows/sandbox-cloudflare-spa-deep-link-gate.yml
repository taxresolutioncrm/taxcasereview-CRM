name: Sandbox Cloudflare SPA Deep Link Gate

on:
  push:
    branches:
      - sandbox/remove-obsolete-pages-404-20260914

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Full app build
        run: npx vite build
      - name: Verify Cloudflare SPA artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/_redirects
          test ! -f dist/404.html
          grep -qxF '/* /index.html 200' dist/_redirects
          echo 'SPA_ARTIFACT_GATE=PASS'