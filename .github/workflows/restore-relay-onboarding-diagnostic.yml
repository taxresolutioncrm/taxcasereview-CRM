name: Restore Relay Onboarding Diagnostic
on:
  push:
    branches:
      - sandbox/restore-relay-onboarding-handoff-20261005
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
