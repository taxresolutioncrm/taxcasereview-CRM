name: RomyLabs Admin Portal sandbox build diagnostics
on:
  push:
    branches:
      - sandbox/demo-lead-workspace-20261030
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate demo lead workflow
        run: node scripts/check-book-demo-alerts.mjs
      - name: Validate SaaS office payment reminder backend
        run: node scripts/check-romylabs-day4-reminders.mjs
      - name: Validate RomyLabs phone conference flow
        run: node tests/romylabs-phone-flow.test.mjs
      - name: Validate on-demand three-way calling without affecting direct dialing
        run: node tests/romylabs-conference-flow.test.mjs
      - name: Verify Admin Portal sales, briefing, storage and audit invariants
        run: node scripts/check-admin-operations-repair.mjs
      - name: Parse executive briefing Deno TypeScript without running live mail
        run: |
          node --input-type=module -e "import {transform} from 'esbuild'; import {readFileSync} from 'node:fs'; await transform(readFileSync('supabase/functions/daily-briefing/index.ts','utf8'),{loader:'ts',format:'esm'}); console.log('PASS executive briefing TypeScript source');"
      - name: Cloudflare-equivalent frontend build
        run: npm run build
      - name: Confirm emitted build marker
        run: test -s dist/taxres-build.json
