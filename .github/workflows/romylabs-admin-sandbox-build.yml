name: RomyLabs Admin Portal sandbox build diagnostics
on:
  push:
    branches:
      - sandbox/demo-lead-workspace-20261030
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate demo lead workflow
        run: node scripts/check-book-demo-alerts.mjs
      - name: Validate SaaS office payment reminder backend
        run: node scripts/check-romylabs-day4-reminders.mjs
      - name: Validate RomyLabs phone conference flow
        run: node tests/romylabs-phone-flow.test.mjs
      - name: Validate on-demand three-way calling without affecting direct dialing
        run: node tests/romylabs-conference-flow.test.mjs
      - name: Validate Admin Portal call email SMS notifications
        run: node tests/romylabs-admin-comms-notifications.test.mjs
      - name: Verify notification overlay safety and cross-product rollout trace
        run: node scripts/check-romylabs-comms-rollout.cjs
      - name: Validate shared tax office communications notifications
        run: node tests/tax-office-communications-notifications.test.mjs
      - name: Cloudflare-equivalent frontend build
        run: npm run build
      - name: Confirm emitted build marker
        run: test -s dist/taxres-build.json
