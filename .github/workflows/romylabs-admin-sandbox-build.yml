name: RomyLabs Admin Portal sandbox build diagnostics
on:
  push:
    branches:
      - sandbox/demo-lead-workspace-20261030
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate demo lead workflow
        run: node scripts/check-book-demo-alerts.mjs
      - name: Validate SaaS office payment reminder backend
        run: node scripts/check-romylabs-day4-reminders.mjs
      - name: Validate RomyLabs phone conference flow
        run: node tests/romylabs-phone-flow.test.mjs
      - name: Validate on-demand three-way calling without affecting direct dialing
        run: node tests/romylabs-conference-flow.test.mjs
      - name: Validate Admin Portal call email SMS notifications
        run: node tests/romylabs-admin-comms-notifications.test.mjs
      - name: Verify Admin Portal sales, briefing, storage and audit invariants
        run: node scripts/check-admin-operations-repair.mjs
      - name: Parse daily briefing TypeScript source
        run: |
          node --input-type=module -e "import {transform} from 'esbuild'; import {readFileSync} from 'node:fs'; await transform(readFileSync('supabase/functions/daily-briefing/index.ts','utf8'),{loader:'ts',format:'esm'}); console.log('PASS executive briefing TypeScript source');"
      - name: Verify PoolVerge Search Console product isolation and authorization
        run: node scripts/check-poolverge-gsc-admin.mjs
      - name: Parse Search Console Deno TypeScript source
        run: |
          node --input-type=module -e "import {transform} from 'esbuild'; import {readFileSync} from 'node:fs'; await transform(readFileSync('supabase/functions/gsc-data/index.ts','utf8'),{loader:'ts',format:'esm'}); console.log('PASS PoolVerge GSC TypeScript');"
      - name: Verify Command Center render initialization regression
        run: node tests/admin-command-center-startup.test.mjs
      - name: Verify PoolVerge Microsoft Clarity integration
        run: node scripts/check-poolverge-clarity-reporting.mjs
      - name: Parse PoolVerge Clarity Edge Function TypeScript
        run: |
          node --input-type=module -e "import {transform} from 'esbuild'; import {readFileSync} from 'node:fs'; await transform(readFileSync('supabase/functions/poolverge-clarity-data/index.ts','utf8'),{loader:'ts',format:'esm'}); console.log('PASS Clarity Edge Function TypeScript');"
      - name: Verify TaxRes GA4 weekly report isolation
        run: node scripts/check-weekly-growth-report-isolation.mjs
      - name: Parse weekly reporting Edge Function TypeScript source
        run: |
          node --input-type=module -e "import {transform} from 'esbuild'; import {readFileSync} from 'node:fs'; await transform(readFileSync('supabase/functions/weekly-growth-report/index.ts','utf8'),{loader:'ts',format:'esm'}); console.log('PASS weekly growth report TypeScript source');"
      - name: Cloudflare-equivalent frontend build
        run: npm run build
      - name: Confirm emitted build marker
        run: test -s dist/taxres-build.json
