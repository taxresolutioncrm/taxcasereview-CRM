name: CloudCPA Branding Sandbox Certification

on:
  push:
    branches:
      - sandbox/cloudcpa-branding-contact-20261008
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: CloudCPA contact branding regression
        run: npm run check-cloudcpa-contact-branding
      - name: CloudCPA readiness
        run: npm run cloudcpa:readiness
      - name: Build sandbox
        run: npm run build
