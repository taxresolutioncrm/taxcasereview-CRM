name: Sandbox E-Sign Final Cleanup Gate

on:
  push:
    branches:
      - sandbox/esign-final-cleanup-20260915

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full app build
        run: |
          npm run build
          git diff --exit-code -- . ':!package-lock.json'
      - name: Parse e-sign Edge Function
        run: npx --yes esbuild supabase/functions/office-agreement-file/index.ts --bundle --platform=neutral --format=esm --external:* --outfile=/tmp/office-agreement-file.js
      - name: Verify final e-sign invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o "if(action==='archive_completed_esign')" supabase/functions/office-agreement-file/index.ts | wc -l)" -eq 1
          grep -q "function isPoaDocument" supabase/functions/office-agreement-file/index.ts
          grep -Fq "/\\b2848\\b/" supabase/functions/office-agreement-file/index.ts
          grep -Fq "/power\\s+of\\s+attorney/" supabase/functions/office-agreement-file/index.ts
          grep -q "if(isPoaDocument(doc))return pdfBytes" supabase/functions/office-agreement-file/index.ts
          grep -q "stampCompletionOnDocument" supabase/functions/office-agreement-file/index.ts
          grep -q "document_kind:'signed_agreement'" supabase/functions/office-agreement-file/index.ts
          grep -q ".eq('document_kind','completion_certificate')" supabase/functions/office-agreement-file/index.ts
          ! grep -q "document_kind:'completed_package'" supabase/functions/office-agreement-file/index.ts
