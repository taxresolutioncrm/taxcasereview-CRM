name: Sandbox Transcript Local Gate
on:
  push:
    branches:
      - sandbox/transcripts-canopy-ui-parity-v2-20260920

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Transcript contract checks
        run: |
          npm run check-transcripts
          npm run check-transcript-parser
          npm run check-transcript-coverage
      - name: Full non-Cloudflare build
        run: npm run build
      - name: Start local Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/transcript-preview.log 2>&1 &
          echo $! > /tmp/transcript-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/transcript-preview.log
          exit 1
      - name: Verify built transcript UI markers
        run: |
          grep -R -q "IRS Transcript Delivery" dist
          grep -R -q "Account Overview" dist
          grep -R -q "CSED Calculations" dist
          grep -R -q "Penalties and Interest" dist
          grep -R -q "Payment History" dist
          grep -R -q "Bankruptcy" dist
          grep -R -q "Account Transactions" dist
          grep -R -q "Assessment Overview" dist
          ! grep -R -q "Watched TDS Download Folder" dist
          ! grep -R -q "New Transcript Pull Request" dist
      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/transcript-preview.log || true
