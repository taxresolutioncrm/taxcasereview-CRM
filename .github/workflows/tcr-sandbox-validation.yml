name: TCR Sandbox Validation

on:
  push:
    branches:
      - sandbox/taxres-popup-helper-tds-20260925

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify build did not mutate tracked source
        run: git diff --exit-code -- . ':!package-lock.json'
