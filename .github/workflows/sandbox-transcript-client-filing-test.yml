name: Sandbox Transcript Client-Filing Test
on:
  push:
    branches:
      - sandbox/transcripts-canopy-ui-parity-v2-20260920

permissions:
  contents: read

jobs:
  client-filing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run transcript exact-client filing integration test
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import vm from 'node:vm'
          import { webcrypto } from 'node:crypto'
          import { Blob } from 'node:buffer'

          const sourcePath = 'src/lib/transcriptPull.js'
          let src = fs.readFileSync(sourcePath, 'utf8')
            .replace(/^import .*$/gm, '')
            .replace(/\bexport\s+/g, '')
          src += '\n;globalThis.__api = { storeTranscriptAnalysis, finalizeDirectDelivery };'

          const calls = {
            clientQueries: [],
            analysisInsert: null,
            documentInsert: null,
            pullUpdate: null,
            storageUpload: 0,
            storageRemove: 0,
          }

          const tenantId = 'tenant-A'
          const exactClientId = 'client-EXACT-123'
          const exactClientName = 'Exact Client LLC'
          const resultPath = `tds-direct/${tenantId}/pull-1/result-hash.pdf`

          function table(name) {
            if (name === 'clients') {
              let id = null
              return {
                select() { return this },
                eq(col, val) { if (col === 'id') id = val; calls.clientQueries.push([col,val]); return this },
                ilike() { return this },
                limit() { return this },
                async maybeSingle() {
                  if (id !== exactClientId) return { data: null, error: null }
                  return { data: { id: exactClientId, name: exactClientName }, error: null }
                },
              }
            }
            if (name === 'transcript_analyses') {
              return {
                insert(payload) {
                  calls.analysisInsert = payload
                  return {
                    select() { return this },
                    async single() { return { data: { id: 'analysis-1' }, error: null } },
                  }
                },
                select() {
                  return {
                    async in() {
                      return { data: [{ id: 'analysis-1', tax_year: '2023', transcript_type: 'Account Transcript' }], error: null }
                    },
                  }
                },
                delete() { return { async eq() { return { error: null } } } },
              }
            }
            if (name === 'documents') {
              return {
                async insert(rows) {
                  calls.documentInsert = rows
                  return { error: null }
                },
              }
            }
            if (name === 'transcript_pull_requests') {
              return {
                update(patch) {
                  calls.pullUpdate = patch
                  return { async eq() { return { error: null } } }
                },
                select() { return this },
                eq() { return this },
                async maybeSingle() { return { data: null, error: null } },
              }
            }
            return {
              select() { return this }, eq() { return this }, not() { return this }, or() { return this },
              async maybeSingle() { return { data: null, error: null } },
            }
          }

          const supabase = {
            async rpc(name) {
              if (name === 'current_tenant_id') return { data: tenantId, error: null }
              return { data: null, error: null }
            },
            from: table,
            storage: {
              from(bucket) {
                if (bucket !== 'documents') throw new Error('Unexpected storage bucket: '+bucket)
                return {
                  async upload() { calls.storageUpload++; return { error: null } },
                  async remove() { calls.storageRemove++; return { error: null } },
                }
              },
            },
            functions: { async invoke() { return { data: {}, error: null } } },
          }

          const context = {
            console,
            supabase,
            crypto: webcrypto,
            Blob,
            File: globalThis.File || class File extends Blob {
              constructor(parts, name, opts={}) { super(parts, opts); this.name=name; this.lastModified=Date.now() }
            },
            fetch: async (url) => ({
              ok: true,
              status: 200,
              async blob() { return new Blob(['synthetic IRS transcript bytes'], { type: 'application/pdf' }) },
            }),
            extractPdfText: async () => 'synthetic IRS transcript text with enough characters for parser validation 2023 account transcript',
            parseIrsTranscript: () => ({
              tax_year: '2023',
              transcript_type: 'Account Transcript',
              account_balance: 1250,
              accrued_penalty: 100,
              accrued_interest: 50,
              assessment_date: '2024-01-15',
              csed_estimate: '2034-01-15',
              flags: {},
            }),
            setTimeout: () => 0,
            setInterval: () => 0,
            clearInterval: () => {},
            window: undefined,
          }
          vm.createContext(context)
          vm.runInContext(src, context, { filename: sourcePath })
          const { storeTranscriptAnalysis, finalizeDirectDelivery } = context.__api

          const fakeFile = new context.File(['pdf'], 'client-transcript.pdf', { type: 'application/pdf' })
          const analysis = context.parseIrsTranscript()

          const id = await storeTranscriptAnalysis(
            fakeFile,
            'STALE DISPLAY NAME THAT MUST NOT CONTROL ROUTING',
            analysis,
            { filePath: resultPath, clientId: exactClientId }
          )

          if (id !== 'analysis-1') throw new Error('Analysis ID was not returned')
          if (calls.storageUpload !== 0) throw new Error('Existing direct-delivery PDF must not be uploaded twice')
          if (calls.analysisInsert?.client_id !== exactClientId) throw new Error('Analysis was not tied to exact client_id')
          if (calls.analysisInsert?.client_name !== exactClientName) throw new Error('Analysis did not canonicalize exact client name')
          if (calls.analysisInsert?.file_path !== resultPath) throw new Error('Analysis did not retain delivered IRS storage path')
          if (calls.analysisInsert?.file_url !== `storage://documents/${resultPath}`) throw new Error('Analysis durable file reference is wrong')
          const doc = calls.documentInsert?.[0]
          if (!doc) throw new Error('Client document row was not created')
          if (doc.client_id !== exactClientId) throw new Error('Documents row was not tied to exact client_id')
          if (doc.client !== exactClientName || doc.clientname !== exactClientName) throw new Error('Documents row did not use canonical client')
          if (doc.docType !== 'Transcripts') throw new Error('Documents row was not filed under Transcripts')
          if (doc.storage_path !== resultPath) throw new Error('Documents row storage_path does not match IRS-delivered PDF')

          calls.analysisInsert = null
          calls.documentInsert = null
          calls.pullUpdate = null
          await finalizeDirectDelivery(
            {
              id: 'pull-1',
              client_id: exactClientId,
              client_name: exactClientName,
              tax_years: '2023',
              transcript_types: ['Account Transcript'],
              result_analysis_ids: [],
              provider_filed_keys: [],
            },
            {
              signedUrl: 'https://signed.test/transcript.pdf',
              filePath: resultPath,
              resultKey: 'result-key-123',
            }
          )

          if (calls.analysisInsert?.client_id !== exactClientId) throw new Error('Direct delivery lost exact client_id during filing')
          const directDoc = calls.documentInsert?.[0]
          if (directDoc?.client_id !== exactClientId) throw new Error('Direct delivery document was not filed to exact client')
          if (!calls.pullUpdate) throw new Error('Pull request completion was not updated')
          if (calls.pullUpdate.provider_status !== 'Filed' || calls.pullUpdate.status !== 'Completed') throw new Error('Covered direct delivery did not complete as Filed')
          if (!calls.pullUpdate.result_analysis_ids?.includes('analysis-1')) throw new Error('Pull request did not retain saved analysis ID')
          if (!calls.pullUpdate.provider_filed_keys?.includes('result-key-123')) throw new Error('Pull request did not retain filed result key')

          console.log('PASS: direct IRS delivery -> exact client analysis -> exact client Documents/Transcripts file -> completed request')
          NODE
      - name: Run existing transcript checks
        run: |
          npm run check-transcripts
          npm run check-transcript-parser
          npm run check-transcript-coverage
      - name: Full non-Cloudflare build
        run: npm run build
