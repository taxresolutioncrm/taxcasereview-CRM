name: Team Chat Sandbox Certification
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        shell: cmd
        run: npm ci
      - name: Production build
        shell: cmd
        run: npm run build
