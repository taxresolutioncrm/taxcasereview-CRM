name: Team Chat Sandbox Certification
on:
  push:
    branches:
      - sandbox/huddle-live-status-20261007
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        shell: powershell
        run: npm ci
      - name: Production build
        shell: powershell
        run: npm run build
