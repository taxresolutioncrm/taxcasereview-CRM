name: Sandbox Visible E-Sign Build Gate

on:
  push:
    branches:
      - sandbox/esign-visible-docusign-dashboard-20260913

permissions:
  contents: read

jobs:
  build-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full project build gate
        run: |
          npm run build
          git diff --exit-code -- . ':!package-lock.json'
