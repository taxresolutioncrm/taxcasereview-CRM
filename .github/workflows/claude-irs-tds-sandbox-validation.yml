# validation-trigger-20260926-1422
name: Claude IRS TDS E2E Sandbox Validation
on:
  push:
    branches:
      - 'sandbox/validate-claude-irs-tds-e2e-20260926'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Claude IRS OAuth architecture
        run: node scripts/check-irs-oauth-architecture.mjs
      - name: TaxRes transcript parity
        run: node scripts/check-taxres-transcript-parity.mjs
      - name: TDS edge runtime
        run: node scripts/check-tds-edge-runtime.mjs
      - name: Claude IRS Edge lifecycle
        run: node scripts/test-claude-irs-edge-lifecycle.mjs
      - name: Transcript parser fixtures
        run: node scripts/check-irs-transcript-parser-fixtures.mjs
      - name: Transcript coverage fixtures
        run: node scripts/check-transcript-coverage-fixtures.mjs
      - name: Full application build
        run: npm run build
      - name: Install browser acceptance dependency
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start sandbox preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/irs-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/irs-preview.log
          exit 1
      - name: Claude IRS browser acceptance
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test e2e/irs-tds-claude.spec.mjs --browser=chromium --reporter=line
