name: Claude IRS TDS E2E Sandbox Validation
on:
  push:
    branches:
      - 'sandbox/validate-claude-irs-tds-e2e-20260926'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Claude IRS OAuth architecture
        run: node scripts/check-irs-oauth-architecture.mjs
      - name: TaxRes transcript parity
        run: node scripts/check-taxres-transcript-parity.mjs
      - name: TDS edge runtime
        run: node scripts/check-tds-edge-runtime.mjs
      - name: Transcript parser fixtures
        run: node scripts/check-irs-transcript-parser-fixtures.mjs
      - name: Transcript coverage fixtures
        run: node scripts/check-transcript-coverage-fixtures.mjs
      - name: Full application build
        run: npm run build
