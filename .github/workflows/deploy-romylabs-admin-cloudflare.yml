name: Deploy RomyLabs Admin to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy/admin-romylabs'

permissions:
  contents: read

concurrency:
  group: romylabs-admin-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not available in this repo'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is not available in this repo'; exit 2; }
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build current main
        run: npx vite build
      - name: Deploy dist to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy dist --project-name=taxcasereview-crm --branch=main --commit-dirty=true
      - name: Verify production reporting bundle
        shell: bash
        run: |
          set -euo pipefail
          base='https://admin.romylabs.com'
          for i in 1 2 3 4 5 6; do
            html="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$base/?v=$(date +%s)" || true)"
            asset="$(printf '%s' "$html" | grep -oE '/assets/index-[^"]+\.js' | head -n1 || true)"
            if [ -n "$asset" ]; then
              js="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$base$asset?v=$(date +%s)" || true)"
              if printf '%s' "$js" | grep -q 'admin_executive_metrics' && printf '%s' "$js" | grep -q 'admin_capture_executive_snapshot'; then
                echo 'admin.romylabs.com is serving the executive reporting accuracy bundle.'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Cloudflare deployment completed but the live Admin bundle was not verified.'
          exit 1
