name: Deploy RomyLabs Admin to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: romylabs-admin-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not available in this repo'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is not available in this repo'; exit 2; }
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build current main
        run: npx vite build
      - name: Deploy dist to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy dist --project-name=taxcasereview-crm --branch=main --commit-dirty=true
      - name: Verify production build marker
        shell: bash
        run: |
          marker='ROMYLABS_MEET_EMAIL_20260830_0545'
          for i in 1 2 3 4 5 6; do
            live=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://admin.romylabs.com/admin-portal-build.txt?v=$(date +%s)" || true)
            if printf '%s' "$live" | grep -q "$marker"; then
              echo 'admin.romylabs.com is serving the current build marker.'
              exit 0
            fi
            sleep 10
          done
          echo 'Cloudflare deployment completed but custom domain did not expose the current marker.'
          exit 1
