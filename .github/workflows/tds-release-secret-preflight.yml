name: TDS Release Secret Preflight

on:
  push:
    branches:
      - sandbox/validate-claude-tds-release-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify required IRS TDS secret names
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=(
            IRS_TDS_CLIENT_ID
            IRS_TDS_JWT_KID
            IRS_TDS_JWT_PRIVATE_KEY_PEM
            IRS_TDS_REDIRECT_URI
            IRS_TDS_REQUEST_URL
            IRS_TDS_REQUEST_TEMPLATE
            IRS_TDS_STATUS_URL_TEMPLATE
            IRS_TDS_AUTH_FLOW_VERIFIED
          )
          for PROJECT in mpxgxfqdbquzkrvvejkh ydrvncdedgjtcprczwpu; do
            echo "Checking $PROJECT"
            OUT="$(supabase secrets list --project-ref "$PROJECT")"
            missing=0
            for NAME in "${REQUIRED[@]}"; do
              if ! printf '%s\n' "$OUT" | grep -Eq "(^|[[:space:]|])${NAME}([[:space:]|]|$)"; then
                echo "::error::${PROJECT} is missing required secret name ${NAME}"
                missing=1
              else
                echo "present: ${NAME}"
              fi
            done
            if printf '%s\n' "$OUT" | grep -Eq '(^|[[:space:]|])IRS_TDS_STUB_MODE([[:space:]|]|$)'; then
              echo "::error::${PROJECT} has IRS_TDS_STUB_MODE configured; production release must not rely on stub mode."
              missing=1
            fi
            test "$missing" -eq 0
          done
          echo "TDS_SECRET_NAME_PREFLIGHT=PASS"
