name: Credential Vault alphabetical product picker
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/admin/CredentialVault.jsx'
      - 'scripts/check-vault-product-alphabetical.mjs'
      - '.github/workflows/credential-vault-product-alphabetical.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-vault-product-alphabetical.mjs
