name: AI Documents Sandbox Build
on:
  push:
    branches:
      - sandbox/ai-documents-routing-fix-20261008
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check-document-intelligence
      - run: npm run build
